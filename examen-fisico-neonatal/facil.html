<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Super Neonatal Bros - UNMDP</title>
    <style>
        body { font-family: 'Press Start 2P', cursive, Arial; background-color: #000; color: #fff; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; overflow: hidden; }
        #game-container { width: 900px; background: #202020; border: 4px solid #fff; box-shadow: 10px 10px 0px #555; padding: 20px; position: relative; }
        #header { background: #ff0000; color: white; padding: 10px; text-align: center; border: 4px solid #fff; margin-bottom: 20px; font-weight: bold; }
        #screen { height: 280px; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #000; border: 4px solid #333; margin-bottom: 20px; position: relative; }
        #baby-icon { font-size: 100px; transition: transform 0.2s; }
        #dialogue { font-size: 1.2rem; text-align: center; padding: 10px; min-height: 60px; color: #00ff00; }
        #hint { color: #ffff00; font-size: 0.8rem; margin-top: 10px; }
        #controls { display: grid; grid-template-columns: 1fr; gap: 10px; }
        button { padding: 15px; border: 4px solid #fff; background: #000; color: #fff; cursor: pointer; font-size: 0.9rem; text-align: left; transition: 0.1s; }
        button:hover { background: #fff; color: #000; transform: scale(1.02); }
        #progress-bar { width: 100%; height: 15px; background: #333; border: 2px solid #fff; margin-bottom: 10px; }
        #progress-fill { height: 100%; background: #ff0000; width: 0%; transition: width 0.3s; }
        .stats { position: absolute; top: 10px; right: 10px; font-size: 0.7rem; color: #aaa; }
        .shake { animation: shake 0.3s; }
        @keyframes shake { 0% {left:0} 25% {left:-10px} 50% {left:10px} 75% {left:-10px} 100% {left:0} }
    </style>
</head>
<body>

<div id="game-container">
    <div id="header">EXAMEN FÍSICO: MODO HARDCORE</div>
    <div class="stats">PASO: <span id="step-num">1</span>/52</div>
    <div id="progress-bar"><div id="progress-fill"></div></div>
    
    <div id="screen">
        <div id="baby-icon">👶</div>
        <div id="dialogue">¡Prepárate para el examen!</div>
        <div id="hint">Si fallas, vuelves al inicio.</div>
    </div>

    <div id="controls"></div>
</div>

<script>
    const checklist = [
        { t: "Se apresenta a la familia y pregunta el nombre del paciente.", e: "👋" },
        { t: "Pide permiso para realizar examen físico", e: "🤝" },
        { t: "Se lava las manos", e: "🧼" },
        { t: "Dice que realizará el examen físico de forma céfalo caudal y desviste al recién nacido", e: "👕" },
        { t: "Dice e inspecciona el estado general del paciente.", e: "🧐" },
        { t: "Realiza y dice que evalúa la coloración de la piel, hemangiomas planos", e: "🖐️" },
        { t: "Realiza y dice que examina faneras (pelos, uñas)", e: "💅" },
        { t: "Dice que evalúa el aspecto nutricional del paciente y el tono muscular", e: "💪" },
        { t: "Realiza evaluación de signos vitales (FC, FR, Temperatura y SatO2)", e: "🩺" },
        { t: "Dice y evalúa la forma del cráneo", e: "💆" },
        { t: "Dice y evalúa la presencia de caput o de cefalohematoma", e: "💆" },
        { t: "Dice y evalúa la presencia y forma de la fontanela anterior.", e: "👶" },
        { t: "Dice y evalúa la presencia y forma de la fontanela posterior.", e: "👶" },
        { t: "Dice que evalúa facie.", e: "😊" },
        { t: "Dice y evalúa la presencia de globos oculares y movilidad ocular", e: "👀" },
        { t: "Dice y evalúa la permeabilidad de las narinas.", e: "👃" },
        { t: "Dice y evalúa anatomía de pabellón auricular.", e: "👂" },
        { t: "Dice y evalúa implantación de pabellón auricular.", e: "👂" },
        { t: "Dice y evalúa la presencia de dentes.", e: "👄" },
        { t: "Dice y evalúa el frenillo lingual.", e: "👅" },
        { t: "Dice y evalúa paladar duro y blando", e: "👄" },
        { t: "Dice y evalúa cuello", e: "🦒" },
        { t: "Dice y evalúa clavículas", e: "🦴" },
        { t: "Realiza auscultación pulmonar anterior simétrica y comparativa.", e: "🫁" },
        { t: "Realiza auscultación pulmonar posterior simétrica y comparativa", e: "🩺" },
        { t: "Dice que evalúa uso de músculos respiratórios accesorios", e: "🫁" },
        { t: "Asculta Ap. cardiovascular en 4 focos (P, A, M, T)", e: "💓" },
        { t: "Toma pulsos braquial y femoral de forma simétrica.", e: "🩺" },
        { t: "Inspecciona el abdomen y ausculta los ruidos hidroaéreos.", e: "🤰" },
        { t: "Realiza palpación superficial y profunda del abdomen.", e: "🖐️" },
        { t: "Realiza palpación de hígado", e: "🤰" },
        { t: "Realiza palpación de bazo", e: "🤰" },
        { t: "Realiza maniobra de peloteo renal", e: "🤰" },
        { t: "Realiza percusión del abdomen", e: "🥁" },
        { t: "Evalúa presencia de 2 arterias y una vena en cordón umbilical", e: "🏥" },
        { t: "Evalúa genitales femeninos (Labios, clítoris)", e: "🚼" },
        { t: "Evalúa genitales masculinos (Pene, epispadias)", e: "🚼" },
        { t: "Evalúa testículos en bolsa y presencia de hidrocele", e: "🔦" },
        { t: "Evalúa permeabilidad del ano", e: "🍑" },
        { t: "Evalúa Aparato osteoarticular: extremidades y dedos", e: "🖐️" },
        { t: "Examina columna", e: "🔙" },
        { t: "Examina región dorsal (manchas, hemangiomas)", e: "🔙" },
        { t: "Evalúa presencia y fondo de Fosa pilonidal", e: "🍑" },
        { t: "Maniobra de Barlow (Caderas)", e: "🦵" },
        { t: "Maniobra de Ortolani (Caderas)", e: "🦵" },
        { t: "Dice y evalúa reflejos del recién nacido", e: "⚡" },
        { t: "Valora la edad gestacional con el Método capurro", e: "📊" },
        { t: "Pesa al Recién Nacido", e: "⚖️" },
        { t: "Mide el perímetro cefálico", e: "📏" },
        { t: "Mide la talla", e: "📏" },
        { t: "Contacto piel con piel y evalúa lactancia", e: "🤱" },
        { t: "Comunica amablemente los datos obtenidos", e: "📝" }
    ];

    let currentStep = 0;

    function updateGame(reset = false) {
        const dialogue = document.getElementById('dialogue');
        const hint = document.getElementById('hint');
        const controls = document.getElementById('controls');
        const fill = document.getElementById('progress-fill');
        const baby = document.getElementById('baby-icon');
        const stepNum = document.getElementById('step-num');

        fill.style.width = (currentStep / checklist.length * 100) + "%";
        stepNum.innerText = currentStep + 1;

        if(reset) {
            dialogue.innerText = "¡OH NO! ERROR CRÍTICO";
            hint.innerText = "Volviendo al nivel 1...";
            document.getElementById('game-container').classList.add('shake');
            setTimeout(() => document.getElementById('game-container').classList.remove('shake'), 300);
        } else {
            dialogue.innerText = `Paso ${currentStep + 1}: ¿Cuál es la siguiente acción?`;
            hint.innerText = currentStep > 0 ? "¡Bien! Sigue así." : "Selecciona la opción correcta.";
        }

        baby.innerText = checklist[currentStep].e;
        baby.style.transform = `scale(${1 + (currentStep * 0.01)})`;

        controls.innerHTML = '';
        let options = [checklist[currentStep].t];
        while(options.length < 3) {
            let rand = checklist[Math.floor(Math.random() * checklist.length)].t;
            if(!options.includes(rand)) options.push(rand);
        }
        options.sort(() => Math.random() - 0.5);

        options.forEach(opt => {
            const btn = document.createElement('button');
            btn.innerText = opt;
            btn.onclick = () => {
                if(opt === checklist[currentStep].t) {
                    currentStep++;
                    if(currentStep < checklist.length) {
                        updateGame(false);
                    } else {
                        victory();
                    }
                } else {
                    currentStep = 0;
                    updateGame(true);
                }
            };
            controls.appendChild(btn);
        });
    }

    function victory() {
        document.getElementById('screen').innerHTML = `
            <h1 style="color:#00ff00">GAME OVER: ¡GANASTE!</h1>
            <p>Has memorizado los 52 pasos con éxito.</p>
            <p style="font-size:0.7rem">Capurro de Pedro: 37.1 Semanas (61 pts)</p>
            <button onclick="location.reload()" style="width:100%; text-align:center">REINTENTAR</button>
        `;
        document.getElementById('controls').innerHTML = '';
    }

    updateGame();
</script>

</body>
</html>
