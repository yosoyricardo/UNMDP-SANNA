<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Simulador de Examen Físico Neonatal - UNMDP</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background-color: #121212; color: #e0e0e0; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        #game-container { width: 900px; background: #1e1e1e; border-radius: 15px; border: 3px solid #b71c1c; box-shadow: 0 0 50px rgba(183, 28, 28, 0.4); overflow: hidden; position: relative; }
        #header { background: #b71c1c; color: white; padding: 15px; text-align: center; text-transform: uppercase; font-weight: bold; }
        #screen { height: 300px; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; background: radial-gradient(circle, #2c2c2c 0%, #1a1a1a 100%); }
        #baby-icon { font-size: 120px; transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); filter: drop-shadow(0 0 10px rgba(255,255,255,0.1)); }
        #dialogue { font-size: 1.5rem; font-weight: bold; color: #fff; text-align: center; margin-bottom: 5px; }
        #hint { font-size: 0.9rem; color: #ffeb3b; font-weight: bold; min-height: 20px; text-transform: uppercase; }
        #controls { padding: 30px; background: #252525; display: grid; grid-template-columns: 1fr; gap: 10px; }
        button { padding: 18px; border: 1px solid #444; border-radius: 10px; background: #333; color: #fff; cursor: pointer; font-size: 1rem; transition: 0.2s; text-align: left; }
        button:hover { background: #444; border-color: #f44336; transform: translateX(5px); }
        #progress-bar { width: 100%; height: 8px; background: #333; }
        #progress-fill { height: 100%; background: #f44336; width: 0%; transition: width 0.3s; }
        .shake { animation: shake 0.5s; }
        @keyframes shake { 0%, 100% {transform: translate(0);} 20% {transform: translate(-10px);} 40% {transform: translate(10px);} 60% {transform: translate(-10px);} 80% {transform: translate(10px);} }
    </style>
</head>
<body>

<div id="game-container">
    <div id="header">Modo Hardcore: Examen Físico (Paso a Paso)</div>
    <div id="progress-bar"><div id="progress-fill"></div></div>
    
    <div id="screen">
        <div id="baby-icon">👶</div>
        <div id="dialogue">¿Cuál es el primer paso?</div>
        <div id="hint"></div>
    </div>

    <div id="controls"></div>
</div>

<script>
    // Checklist textual del PDF 
    const checklist = [
        { t: "Se apresenta a la familia y pregunta el nombre del paciente.", e: "👋" },
        { t: "Pide permiso para realizar examen físico", e: "🤝" },
        { t: "Se lava las manos", e: "🧼" },
        { t: "Dice que realizará el examen físico de forma céfalo caudal y desviste al recién nacido", e: "👶" },
        { t: "Dice e inspecciona el estado general del paciente.", e: "🧐" },
        { t: "Realiza y dice que evalúa la coloración de la piel, hemangiomas planos", e: "🖐️" },
        { t: "Realiza y dice que examina faneras (pelos, uñas)", e: "💅" },
        { t: "Dice que evalúa el aspecto nutricional del paciente y el tono muscular", e: "💪" },
        { t: "Realiza evaluación de signos vitales (FC, FR, Temperatura y saturación de oxígeno)", e: "🩺" },
        { t: "Dice y evalúa la forma del cráneo", e: "💆" },
        { t: "Dice y evalúa la presencia de caput o de cefalohematoma", e: "💆" },
        { t: "Dice y evalúa la presencia y forma de la fontanela anterior.", e: "👶" },
        { t: "Dice y evalúa la presencia y forma de la fontanela posterior.", e: "👶" },
        { t: "Dice que evalúa facie.", e: "😊" },
        { t: "Dice y evalúa la presencia de globos oculares y movilidad ocular", e: "👀" },
        { t: "Dice y evalúa la permeabilidad de las narinas.", e: "👃" },
        { t: "Dice y evalúa anatomía de pabellón auricular.", e: "👂" },
        { t: "Dice y evalúa implantación de pabellón auricular.", e: "👂" },
        { t: "Dice y evalúa la presencia de dientes.", e: "👄" },
        { t: "Dice y evalúa el frenillo lingual.", e: "👅" },
        { t: "Dice y evalúa paladar duro y blando", e: "👄" },
        { t: "Dice y evalúa cuello", e: "🦒" },
        { t: "Dice y evalúa clavículas", e: "🦴" },
        { t: "Realiza y dice auscultación pulmonar anterior simétrica y comparativa.", e: "🫁" },
        { t: "Realiza y dice auscultación pulmonar posterior simétrica y comparativa", e: "🩺" },
        { t: "Dice que evalúa uso de músculos respiratórios accesorios", e: "🫁" },
        { t: "Dice y ausculta Ap. cardiovascular en 4 focos: pulmonar, aórtico, mitral y tricuspídeo", e: "💓" },
        { t: "Dice y toma pulsos braquial y femoral de forma simétrica y comparativa.", e: "🩺" },
        { t: "Dice qué inspecciona el abdomen y ausculta los ruidos hidroaéreos.", e: "🤰" },
        { t: "Dice y realiza una palpación superficial y luego profunda del abdomen.", e: "🖐️" },
        { t: "Realiza palpación de hígado", e: "🤰" },
        { t: "Realiza palpación de bazo", e: "🤰" },
        { t: "Realiza maniobra de peloteo renal", e: "🤰" },
        { t: "Dice y realiza percusión del abdomen", e: "🥁" },
        { t: "Dice que evalúa presencia de 2 arterias y una vena en cordón umbilical", e: "🏥" },
        { t: "Dice que evalúa genitales femeninos: Labios mayores y menores, capuchon de clitoris", e: "🚼" },
        { t: "Dice que evalúa genitales masculinos: presencia de pene: epispadias, hipospadias.", e: "🚼" },
        { t: "Dice que evalúa Testículos en bolsa, presencia de hidrocele (transluminiscencia)", e: "🔦" },
        { t: "Dice que evalúa permeabilidad del ano", e: "🍑" },
        { t: "Dice que evalúa Aparato osteoarticular: presencia de extremidades y dedos", e: "🖐️" },
        { t: "Examina columna", e: "🔙" },
        { t: "Realiza y dice que examina región dorsal presencia de mechones, hemangiomas en línea media.", e: "🔙" },
        { t: "Evalúa presencia y fondo de Fosa pilonidal", e: "🍑" },
        { t: "Deja maniobras invasivas para el final. Dice en voz alta que evalúa caderas: Realiza Maniobra de Barlow", e: "🦵" },
        { t: "Realiza maniobra de Ortolani", e: "🦵" },
        { t: "Dice y evalúa reflejos del recien nacido", e: "⚡" },
        { t: "Valora la edad gestacional con el Método capurro", e: "📊" },
        { t: "Pesa al Recién Nacido", e: "⚖️" },
        { t: "Mide el perímetro cefálico del Recién Nacido", e: "📏" },
        { t: "Mide la talla del Recién Nacido", e: "📏" },
        { t: "Deja al recién nacido en contacto piel con piel mientras evalúa la lactancia", e: "🤱" },
        { t: "Comunica amablemente los datos obtenidos del examen físico", e: "📝" }
    ];

    let currentStep = 0;

    function updateGame(reset = false) {
        const dialogue = document.getElementById('dialogue');
        const hint = document.getElementById('hint');
        const controls = document.getElementById('controls');
        const fill = document.getElementById('progress-fill');
        const baby = document.getElementById('baby-icon');

        fill.style.width = (currentStep / checklist.length * 100) + "%";

        if(reset) {
            hint.innerText = "🚨 ¡ERROR! COMENZANDO DE CERO...";
            document.getElementById('game-container').classList.add('shake');
            setTimeout(() => document.getElementById('game-container').classList.remove('shake'), 500);
        } else {
            hint.innerText = currentStep > 0 ? "¡Correcto! Siguiente paso..." : "";
        }

        dialogue.innerText = `Paso ${currentStep + 1}: ¿Qué sigue?`;
        baby.innerText = checklist[currentStep].e;

        controls.innerHTML = '';
        
        // Generar opciones: 1 correcta y 2 aleatorias
        let options = [checklist[currentStep].t];
        while(options.length < 3) {
            let rand = checklist[Math.floor(Math.random() * checklist.length)].t;
            if(!options.includes(rand)) options.push(rand);
        }
        options.sort(() => Math.random() - 0.5);

        options.forEach(opt => {
            const btn = document.createElement('button');
            btn.innerText = opt;
            btn.onclick = () => {
                if(opt === checklist[currentStep].t) {
                    currentStep++;
                    if(currentStep < checklist.length) {
                        updateGame(false);
                    } else {
                        victory();
                    }
                } else {
                    currentStep = 0;
                    updateGame(true);
                }
            };
            controls.appendChild(btn);
        });
    }

    function victory() {
        document.getElementById('screen').innerHTML = `
            <h1 style="color:#4caf50">🏆 ¡EXAMEN PERFECTO!</h1>
            <p>Has completado los 52 pasos según la UNMDP.</p>
            <div style="background:#333; padding:10px; border-radius:10px; font-size:0.8rem; border-left: 5px solid #f44336">
                <strong>EJERCICIO CAPURRO (PEDRO):</strong><br>
                Oreja: incurvada (16 pts) | Glándula: 9mm (10 pts) | Pezón: 8mm (10 pts)<br>
                Piel: fendas (15 pts) | Pliegues: mitad ant. (10 pts)<br>
                <strong>Total: 61 pts | Edad: 37.1 Semanas</strong>
            </div>
            <button onclick="location.reload()" style="margin-top:20px; width:100%; text-align:center">REINICIAR ENTRENAMIENTO</button>
        `;
        document.getElementById('controls').innerHTML = '';
        document.getElementById('progress-fill').style.background = "#4caf50";
    }

    updateGame();
</script>

</body>
</html>
