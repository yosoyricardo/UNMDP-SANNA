<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Examen Fisico </title>

<style>
:root{
    --bg:#071826;
    --panel:#10273a;
    --card:#16344d;
    --accent:#00d4ff;
    --success:#28c76f;
    --danger:#ff4d4f;
    --warning:#ffb020;
    --text:#ffffff;
}

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial, Helvetica, sans-serif;
    background:linear-gradient(135deg,#06111c,#10304a);
    color:var(--text);
    min-height:100vh;
    padding:20px;
}

.container{
    max-width:1100px;
    margin:auto;
}

header{
    text-align:center;
    margin-bottom:20px;
}

h1{
    color:var(--accent);
    margin-bottom:10px;
}

.subtitle{
    opacity:.9;
}

.panel{
    background:var(--panel);
    border-radius:16px;
    padding:20px;
    margin-top:15px;
    box-shadow:0 0 20px rgba(0,0,0,.3);
}

.topbar{
    display:flex;
    flex-wrap:wrap;
    justify-content:space-between;
    gap:10px;
    margin-bottom:15px;
}

.badge{
    background:var(--card);
    padding:10px 15px;
    border-radius:10px;
    font-weight:bold;
}

.timer{
    color:#ffd166;
}

.steps{
    display:flex;
    flex-direction:column;
    gap:10px;
}

.step{
    background:var(--card);
    border:2px solid transparent;
    padding:14px;
    border-radius:12px;
    cursor:pointer;
    transition:.2s;
    user-select:none;
}

.step:hover{
    border-color:var(--accent);
}

.correct{
    border-color:var(--success)!important;
    background:#11492c!important;
}

.wrong{
    border-color:var(--danger)!important;
    background:#4b1717!important;
}

button{
    background:var(--accent);
    color:#000;
    border:none;
    padding:12px 20px;
    border-radius:10px;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    opacity:.9;
}

.center{
    text-align:center;
}

.hidden{
    display:none;
}

.message{
    margin-top:15px;
    font-weight:bold;
}

.dragging{
    opacity:.5;
}

.result{
    text-align:center;
    font-size:1.2rem;
}

.medical{
    font-size:40px;
    margin-bottom:10px;
}

@media(max-width:700px){
    .topbar{
        flex-direction:column;
    }
}
</style>
</head>
<body>

<div class="container">

<header>
<div class="medical">🚑👶</div>
<h1>Entrenamiento de Examen Físico</h1>
<p class="subtitle">Examen Fisico </p>
</header>

<div class="panel" id="menu">
    <h2>Selecciona un nivel</h2>
    <br>
    <button onclick="startLevel(1)">Nivel 1 - Reordenar Checklist</button>
    <button onclick="startLevel(2)">Nivel 2 - Continuar tras error</button>
    <button onclick="startLevel(3)">Nivel 3 - Error = Reinicio</button>
</div>

<div class="panel hidden" id="game">

    <div class="topbar">
        <div class="badge">Nivel: <span id="level"></span></div>
        <div class="badge timer">⏱ Tiempo: <span id="time">04:00</span></div>
        <div class="badge">Errores: <span id="errors">0</span></div>
    </div>

    <div id="instructions"></div>
    <br>

    <div class="steps" id="steps"></div>

    <div class="message" id="message"></div>

</div>

<div class="panel hidden" id="result">
    <div class="result" id="resultText"></div>
    <br>
    <button onclick="location.reload()">Volver al menú</button>
</div>

</div>

<script>
const checklist = [
        { t: "Se apresenta a la familia y pregunta el nombre del paciente.", e: "👋" },
        { t: "Pide permiso para realizar examen físico", e: "🤝" },
        { t: "Se lava las manos", e: "🧼" },
        { t: "Dice que realizará el examen físico de forma céfalo caudal y desviste al recién nacido", e: "👶" },
        { t: "Dice e inspecciona el estado general del paciente.", e: "🧐" },
        { t: "Realiza y dice que evalúa la coloración de la piel, hemangiomas planos", e: "🖐️" },
        { t: "Realiza y dice que examina faneras (pelos, uñas)", e: "💅" },
        { t: "Dice que evalúa el aspecto nutricional del paciente y el tono muscular", e: "💪" },
        { t: "Realiza evaluación de signos vitales (FC, FR, Temperatura y saturación de oxígeno)", e: "🩺" },
        { t: "Dice y evalúa la forma del cráneo", e: "💆" },
        { t: "Dice y evalúa la presencia de caput o de cefalohematoma", e: "💆" },
        { t: "Dice y evalúa la presencia y forma de la fontanela anterior.", e: "👶" },
        { t: "Dice y evalúa la presencia y forma de la fontanela posterior.", e: "👶" },
        { t: "Dice que evalúa facie.", e: "😊" },
        { t: "Dice y evalúa la presencia de globos oculares y movilidad ocular", e: "👀" },
        { t: "Dice y evalúa la permeabilidad de las narinas.", e: "👃" },
        { t: "Dice y evalúa anatomía de pabellón auricular.", e: "👂" },
        { t: "Dice y evalúa implantación de pabellón auricular.", e: "👂" },
        { t: "Dice y evalúa la presencia de dientes.", e: "👄" },
        { t: "Dice y evalúa el frenillo lingual.", e: "👅" },
        { t: "Dice y evalúa paladar duro y blando", e: "👄" },
        { t: "Dice y evalúa cuello", e: "🦒" },
        { t: "Dice y evalúa clavículas", e: "🦴" },
        { t: "Realiza y dice auscultación pulmonar anterior simétrica y comparativa.", e: "🫁" },
        { t: "Realiza y dice auscultación pulmonar posterior simétrica y comparativa", e: "🩺" },
        { t: "Dice que evalúa uso de músculos respiratórios accesorios", e: "🫁" },
        { t: "Dice y ausculta Ap. cardiovascular en 4 focos: pulmonar, aórtico, mitral y tricuspídeo", e: "💓" },
        { t: "Dice y toma pulsos braquial y femoral de forma simétrica y comparativa.", e: "🩺" },
        { t: "Dice qué inspecciona el abdomen y ausculta los ruidos hidroaéreos.", e: "🤰" },
        { t: "Dice y realiza una palpación superficial y luego profunda del abdomen.", e: "🖐️" },
        { t: "Realiza palpación de hígado", e: "🤰" },
        { t: "Realiza palpación de bazo", e: "🤰" },
        { t: "Realiza maniobra de peloteo renal", e: "🤰" },
        { t: "Dice y realiza percusión del abdomen", e: "🥁" },
        { t: "Dice que evalúa presencia de 2 arterias y una vena en cordón umbilical", e: "🏥" },
        { t: "Dice que evalúa genitales femeninos: Labios mayores y menores, capuchon de clitoris", e: "🚼" },
        { t: "Dice que evalúa genitales masculinos: presencia de pene: epispadias, hipospadias.", e: "🚼" },
        { t: "Dice que evalúa Testículos en bolsa, presencia de hidrocele (transluminiscencia)", e: "🔦" },
        { t: "Dice que evalúa permeabilidad del ano", e: "🍑" },
        { t: "Dice que evalúa Aparato osteoarticular: presencia de extremidades y dedos", e: "🖐️" },
        { t: "Examina columna", e: "🔙" },
        { t: "Realiza y dice que examina región dorsal presencia de mechones, hemangiomas en línea media.", e: "🔙" },
        { t: "Evalúa presencia y fondo de Fosa pilonidal", e: "🍑" },
        { t: "Deja maniobras invasivas para el final. Dice en voz alta que evalúa caderas: Realiza Maniobra de Barlow", e: "🦵" },
        { t: "Realiza maniobra de Ortolani", e: "🦵" },
        { t: "Dice y evalúa reflejos del recien nacido", e: "⚡" },
        { t: "Valora la edad gestacional con el Método capurro", e: "📊" },
        { t: "Pesa al Recién Nacido", e: "⚖️" },
        { t: "Mide el perímetro cefálico del Recién Nacido", e: "📏" },
        { t: "Mide la talla del Recién Nacido", e: "📏" },
        { t: "Deja al recién nacido en contacto piel con piel mientras evalúa la lactancia", e: "🤱" },
        { t: "Comunica amablemente los datos obtenidos del examen físico", e: "📝" }
    ];

let level = 1;
let timer;
let seconds = 240;
let errors = 0;
let currentIndex = 0;

function startLevel(lvl){

    level = lvl;

    document.getElementById("menu").classList.add("hidden");
    document.getElementById("game").classList.remove("hidden");

    document.getElementById("level").textContent = lvl;
    document.getElementById("errors").textContent = 0;

    errors = 0;
    currentIndex = 0;

    startTimer();

    if(level===1){
        setupLevel1();
    }else{
        setupLevel2or3();
    }
}

function startTimer(){

    clearInterval(timer);

    seconds = 240;

    updateTimer();

    timer = setInterval(()=>{
        seconds--;

        updateTimer();

        if(seconds<=0){
            lose("⏰ Tiempo agotado");
        }

    },1000);
}

function updateTimer(){
    let m = Math.floor(seconds/60);
    let s = seconds%60;

    document.getElementById("time").textContent =
        String(m).padStart(2,"0")+":"+
        String(s).padStart(2,"0");
}

function shuffle(arr){
    return [...arr].sort(()=>Math.random()-0.5);
}

function setupLevel1(){

    document.getElementById("instructions").innerHTML =
    "<b>Objetivo:</b> Arrastra los pasos hasta colocarlos en el orden correcto.";

    const container = document.getElementById("steps");
    container.innerHTML = "";

    let items = shuffle(checklist);

    items.forEach(text=>{

        const div = document.createElement("div");
        div.className = "step";
        div.draggable = true;
        div.textContent = text.t + text.e;

        container.appendChild(div);
    });

    enableDragAndDrop();

    const btn = document.createElement("button");
    btn.textContent = "Verificar Orden";
    btn.onclick = checkLevel1;

    container.appendChild(btn);
}

function enableDragAndDrop(){

    const items = document.querySelectorAll(".step");

    let dragged;

    items.forEach(item=>{

        item.addEventListener("dragstart",()=>{
            dragged=item;
            item.classList.add("dragging");
        });

        item.addEventListener("dragend",()=>{
            item.classList.remove("dragging");
        });

        item.addEventListener("dragover",(e)=>{
            e.preventDefault();
        });

        item.addEventListener("drop",(e)=>{
            e.preventDefault();

            if(dragged!==item){

                const parent=item.parentNode;
                const nodes=[...parent.querySelectorAll(".step")];

                const draggedIndex=nodes.indexOf(dragged);
                const targetIndex=nodes.indexOf(item);

                if(draggedIndex<targetIndex){
                    parent.insertBefore(dragged,item.nextSibling);
                }else{
                    parent.insertBefore(dragged,item);
                }
            }
        });
    });
}

function checkLevel1(){

    const items=[...document.querySelectorAll(".step")]
        .map(el=>el.textContent);

    let ok=true;

    for(let i=0;i<checklist.length;i++){
        if(items[i]!==checklist[i]){
            ok=false;
            break;
        }
    }

    if(ok){
        win();
    }else{
        document.getElementById("message").innerHTML =
        "❌ El orden aún no es correcto.";
    }
}

function setupLevel2or3(){

    document.getElementById("instructions").innerHTML =
    "<b>Objetivo:</b> Selecciona el siguiente paso correcto.";

    renderSelectionLevel();
}

function renderSelectionLevel(){

    const container=document.getElementById("steps");
    container.innerHTML="";

    let remaining=checklist.slice(currentIndex);

    let options=shuffle(remaining).slice(0,5);

    if(!options.includes(checklist[currentIndex])){
        options[0]=checklist[currentIndex];
    }

    options=shuffle(options);

    options.forEach(text=>{

        const div=document.createElement("div");
        div.className="step";
        div.textContent=text.t + text.e;

        div.onclick=()=>selectStep(text,div);

        container.appendChild(div);
    });
}

function selectStep(text,element){

    if(text===checklist[currentIndex]){

        element.classList.add("correct");

        setTimeout(()=>{

            currentIndex++;

            if(currentIndex>=checklist.length){
                win();
            }else{
                renderSelectionLevel();
            }

        },400);

    }else{

        errors++;
        document.getElementById("errors").textContent=errors;

        element.classList.add("wrong");

        if(level===3){

            currentIndex=0;

            document.getElementById("message").innerHTML=
            "🚨 Error. Reinicias desde el primer paso.";

            setTimeout(renderSelectionLevel,700);

        }else{

            document.getElementById("message").innerHTML=
            "⚠️ Error registrado. Continúa.";

        }
    }
}

function win(){

    clearInterval(timer);

    document.getElementById("game").classList.add("hidden");
    document.getElementById("result").classList.remove("hidden");

    document.getElementById("resultText").innerHTML=
    "🏆 ¡Checklist completado!<br><br>Errores: "+errors;
}

function lose(text){

    clearInterval(timer);

    document.getElementById("game").classList.add("hidden");
    document.getElementById("result").classList.remove("hidden");

    document.getElementById("resultText").innerHTML=
    text;
}

</script>

</body>
  </html>
