<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checklist por Voz</title>
<style>
body{font-family:Arial,sans-serif;background:#3d152a;color:white;max-width:900px;margin:auto;padding:20px}
.card{background:#1e293b;padding:20px;border-radius:15px;margin-top:15px}
.score{font-size:1.2rem;margin-top:15px}
.good{color:#22c55e}.bad{color:#ef4444}
.hidden{display:none}.progress{margin-bottom:10px}
</style>
</head>
<body>
<script>
const sons = {
    ok: [
        "../sounds/ok-1.mp3",
        "../sounds/ok-2.mp3",
        "../sounds/ok-3.mp3"
    ],
    erro: [
        "../sounds/no-1.mp3",
        "../sounds/no-2.mp3",
        "../sounds/no-3.mp3"
    ],
    finalizado: [
        "../sounds/victoria-1.mp3",
        "../sounds/victoria-2.mp3",
        "../sounds/victoria-3.mp3",
        "../sounds/victoria-4.mp3",
    ],
    fale: [
        "../sounds/fale-0.mp3",
    ],
    inicio: [
        "../sounds/inicio-0.mp3",
    ]
};

function tocarSom(tipo) {
    const lista = sons[tipo];
    const indice = Math.floor(Math.random() * lista.length);

    const audio = new Audio(lista[indice-1]);
    audio.play();
}
</script>
<h1>🎤 Entrenamiento de Examen Físico</h1>
<button id="startBtn">▶️ Iniciar simulador</button>

<div class="card">
<div class="progress">
Paso <span id="stepNum">1</span> / <span id="totalSteps"></span>
</div>

<h3>Paso esperado</h3>
<p id="expected"></p>

<div id="result" class="score hidden"></div><br><button id="repeatBtn">🔁 Repetir passo</button>
</div>

<div class="card hidden" id="finalCard">
<h2>🏆 Entrenamiento finalizado</h2>
<p id="finalScore"></p>
</div>

<script>

const checklist = [
  "Saludo.",
  "Me presento.",
  "Pregunto el nombre del paciente.",
  "En los adolescentes pregunto cómo quiere que lo llame.",
  "Si es mayor a 13 años pregunto si Desea realizar consulta solo o acompañado.",
  "Realizo lavado de manos.",
  "Desvisto al paciente de manera respetuosa, teniendo en cuenta la edad y los tiempos de la consulta.",
  "Pido permiso para iniciar el examen físico.",
  "Digo en voz alta que voy a realizar el examen físico de forma cefalo-caudal.",
  "Inspeccióno el estado general del paciente",
  "Realizo la evaluación de todos los signos vitales (frecuencia cardíaca, Frecuencia Respiratoria, Temperatura y Saturación de Oxígeno",
  "Dice y realiza en voz alta que evalúa la forma del cráneo. Cuero cabelludo (contextura, distribución, color, si existe pediculosis, lesiones, etc en preescolar/adolescentes)",
  "Dice en voz alta que evalúa la fontanela anterior (en lactante).",
  "Dice en voz alta que evalúa fontanela posterior (en lactante).",
  "Dice en voz alta que evalúa facie.",
  "Dice y realiza en voz alta que evalúa piel y mucosas (normocoloreadas, normohidratada, si tiene presencia de nevus, manchas, Petequias, etc) Color de piel: Palidez, Ictericia",
  "Dice y realiza en voz alta que evalúa Globos oculares, asimetrías, opacidades, coloración iris, pupilas, estrabismo",
  "Solo debe de nombrar: Dice en voz alta que evalúa fijación de la mirada. (en lactantes)",
  "Solo debe de nombrar: Realiza reflejo rojo. Opacidades. (en lactante)",
  "Dice en voz alta que evalúa anatomía de pabellón auricular, evalúa implantación de pabellón auricular, implantación baja asociado a cromosomopatías en lactantes.",
  "Realiza otoscopia en cada oído.",
  "Examina nariz y fosas nasales",
  "Dice en voz alta que evalúa la presencia de dientes y características de los mismos. Caries u otras lesiones en la boca.",
    "Dice en voz alta que evalúa el frenillo sublingual (en lactantes).",
  "Dice y realiza evaluación del cuello Ej: ganglios (tiroides en adolescentes).",
  "Dice y realiza evaluación de espacio supraclavicular",
  "Dice y realiza la Inspección del tórax, evalúa forma y mecánica ventilatoria",
  "Realiza y dice en voz alta auscultación pulmonar anterior simétrica y comparativa.",
  "Realiza y dice en voz alta auscultación pulmonar posterior simétrica y comparativa",
  "Realiza y dice en voz alta auscultación de la región lateral del tórax.",
  "Realiza y dice en voz alta que auscultación del aparato cardiovascular en 4 focos (los localiza mientras realiza la maniobra de auscultación)",
  "Realiza y dice en voz alta que toma pulsos de forma simétrica y comparativa. Debe de realizar todos los pulsos. En caso de RN y lactantes puede mencionar que si existe asimetría entre pulsos braquiales y femorales asociada a coartación de aorta.",
  "Realiza y dice en voz alta Inspección abdominal",
  "Realiza y dice en voz alta auscultación abdominal para determinar presencia de ruidos hidroaéreos.(aumentados, normales o disminuidos)",
  "Realiza y dice en voz alta la palpación superficial de abdomen",
  "Realiza y dice en voz alta la palpación profunda de abdomen",
  "Realiza la maniobra de palpación de hígado",
  "Realiza la maniobra de palpación del bazo",
  "Realiza la maniobra de palpación en búsqueda de masas profundas y peloteo renal.",
  "Realiza percusión abdominal",
  "Dice en voz alta y evalúa genitales femeninos: presencia de labios mayores,labios menores. Sinequias vulvares,Presencia de Capuchon del clitoris",
  "Dice en voz alta y evalúa genitales masculinos: presencia de pene y testículos, ubicación de uretra. Epispadias o Hipospadias, Testículos en bolsa. Presencia de hidrocele, diagnóstico diferencial con hernia inguinal. Transiluminación, puede realizarla",
  "Dice que calcula estadios de Tanner (en adolescentes)",
  "Dice en voz alta que evalúa Aparato osteoarticular: presencia de extremidades y dedos (en recién nacidos).",
  "Realiza y dice en voz alta que evalúa pliegues de miembros inferiores por delante y por detrás en lactantes",
  "Evalúa simetría de longitud de miembros inferiores.",
  "Realiza Signo de Galeazzi en lactantes",
  "SOLO debe de nombrar que va a Realiza Maniobra de Ortolani y Barlow en lactantes ( no les dará tiempo en esa posta en hacer la maniobra)",
  "Dice en voz alta que evalúa Aparato osteoarticular:(preescolar, escolar y adolescente) Evalúa la columna: con el paciente de espalda, se debe observar • Nivel de los hombros. • Nivel de las escápulas. • Nivel de la pelvis.",
  "Dice que realiza la Maniobra de Adams (a partir de preescolar, escolar y adolescentes)",
  "Dice que evalúa rodillas, genu valgo, genu varo (según la edad que corresponda)",
  "Dice que evalúa pies, pie plano (según la edad que corresponda)",
  "Dice en voz alta que realiza examen neurológico ( esto no se evaluará en este examen, solo mencionar este punto)",
  "Dice en voz alta que evalúa desarrollo en sus 4 áreas (personal- social, lenguaje, motricidad fina y gruesa hasta los 6 años)",
  "Dice que realiza toma de peso y percentila ( solo nombrar este punto)",
  "Dice que realiza toma de talla y percentila ( solo nombrar este punto)",
  "Dice que realiza toma el perímetro cefálico en menores de 3 años y percentila ( solo nombrar este punto)",
  "Dice que realiza el cálculo del IMC y percentila ( solo nombrar este punto)",
  "Dice que realiza la toma de TA (en mayores de 3 años) y percentila ( solo nombrar este punto)",
  "SOLO debe de nombrar ( no tendrá tiempo para hacerlo) Dice y evalúa la agudeza visual con la tabla correspondiente a su edad. Comunica resultado de cada ojo y si debe realizar alguna derivación",
  "Se Comunica amablemente y anota los datos recabados en la historia clínica"
];
    

let currentIndex = 0;
let totalSimilarity = 0;
let attempts = 0;

document.getElementById("totalSteps").textContent = checklist.length;

function showStep(){
 document.getElementById("expected").textContent = checklist[currentIndex];
 document.getElementById("stepNum").textContent = currentIndex + 1;
}

function normalize(text){
 return text.toLowerCase()
 .normalize("NFD")
 .replace(/[\u0300-\u036f]/g,"")
 .replace(/[^\w\s]/g,"")
 .replace(/\s+/g," ")
 .trim();
}

function editDistance(a,b){
 const matrix=[];
 for(let i=0;i<=b.length;i++) matrix[i]=[i];
 for(let j=0;j<=a.length;j++) matrix[0][j]=j;

 for(let i=1;i<=b.length;i++){
   for(let j=1;j<=a.length;j++){
     if(b.charAt(i-1)===a.charAt(j-1)){
       matrix[i][j]=matrix[i-1][j-1];
     } else {
       matrix[i][j]=Math.min(
         matrix[i-1][j-1]+1,
         matrix[i][j-1]+1,
         matrix[i-1][j]+1
       );
     }
   }
 }
 return matrix[b.length][a.length];
}

function similarity(a,b){
 a=normalize(a);
 b=normalize(b);
 const longer=a.length>b.length?a:b;
 const shorter=a.length>b.length?b:a;
 if(longer.length===0) return 100;
 return ((longer.length-editDistance(longer,shorter))/longer.length)*100;
}

const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

if(!SpeechRecognition){
 alert("Este navegador no soporta reconocimiento de voz.");
}

const recognition = new SpeechRecognition();
recognition.lang="es-AR";
recognition.interimResults=false;
recognition.maxAlternatives=1;

let listening=false;

function startListening(){
 if(listening) return;
 listening=true;
 tocarSom("fale");
 document.getElementById("result").innerHTML="🎙️ Escuchando...";
 recognition.start();
}

recognition.onresult=(event)=>{
 listening=false;

 const spoken=event.results[0][0].transcript;
 const expected=checklist[currentIndex];
 const score=similarity(spoken,expected);

 totalSimilarity+=score;
 attempts++;

 if(score>=60){
   tocarSom("ok");
   document.getElementById("result").innerHTML=`
   <div class="good">
   <b>✅ Correcto</b><br><br>
   Dijiste:<br>${spoken}<br><br>
   Similaridad: ${score.toFixed(1)}%<br><br>
   ⏭️ Pasando al siguiente paso...
   </div>`;

   setTimeout(()=>{
     currentIndex++;
     if(currentIndex>=checklist.length){
       finish();
       return;
     }
     showStep();
     startListening();
   },1500);
 }else{
   tocarSom("erro");
   document.getElementById("result").innerHTML=`
   <div class="bad">
   <b>❌ Repite el paso</b><br><br>
   Dijiste:<br>${spoken}<br><br>
   Esperado:<br>${expected}<br><br>
   Similaridad: ${score.toFixed(1)}%<br><br>
   🔄 Intentando nuevamente...
   </div>`;

   setTimeout(()=>startListening(),2000);
 }
};

recognition.onerror=(event)=>{
 listening=false;

 if(event.error==="no-speech" || event.error==="aborted"){
   setTimeout(()=>startListening(),1000);
   return;
 }

 document.getElementById("result").innerHTML="⚠️ "+event.error;
 setTimeout(()=>startListening(),1500);
};

function finish(){
  tocarSom("finalizado");
 document.querySelector(".card").classList.add("hidden");
 document.getElementById("finalCard").classList.remove("hidden");

 const average = attempts ? totalSimilarity/attempts : 0;

 document.getElementById("finalScore").innerHTML =
 `📊 Nota final: <b>${average.toFixed(1)}%</b>`;
}


document.getElementById("repeatBtn").addEventListener("click",()=>{
  try{
    recognition.abort();
  }catch(e){}

  listening=false;

  document.getElementById("result").innerHTML=`
    🎙️ Repita novamente:
    <br><br>
    <b>${checklist[currentIndex]}</b>
  `;

  setTimeout(()=>startListening(),300);
});

window.onload=()=>{
 showStep();
};

document.getElementById("startBtn").addEventListener("click",()=>{
  tocarSom("inicio");
  document.getElementById("result").classList.remove('result');
  document.getElementById("startBtn").disabled = true;
  startListening();
});
</script>
</body>
</html>
