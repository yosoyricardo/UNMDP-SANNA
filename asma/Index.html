<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OSCE - Crisis Asmática Grave</title>

<style>
body{
font-family:Arial,sans-serif;
background:#081b29;
color:white;
margin:0;
padding:20px;
}

.container{
max-width:1100px;
margin:auto;
}

h1{
text-align:center;
color:#4dd0ff;
}

.card{
background:#102c3f;
padding:20px;
border-radius:15px;
margin-top:15px;
}

button{
background:#4dd0ff;
border:none;
padding:12px 18px;
margin:5px;
border-radius:8px;
font-weight:bold;
cursor:pointer;
}

button:hover{
opacity:.9;
}

.step{
background:#173d57;
padding:12px;
margin:8px 0;
border-radius:10px;
cursor:pointer;
border:2px solid transparent;
}

.step:hover{
border-color:#4dd0ff;
}

.correct{
background:#1f6f43 !important;
}

.wrong{
background:#8f2323 !important;
}

.topbar{
display:flex;
flex-wrap:wrap;
justify-content:space-between;
gap:10px;
margin-bottom:15px;
}

.badge{
background:#173d57;
padding:10px;
border-radius:8px;
}

.hidden{
display:none;
}

@media(max-width:700px){
.topbar{
flex-direction:column;
}
}
</style>
</head>
<body>

<div class="container">

<h1>🚑 Crisis Asmática Grave - Entrenamiento OSCE</h1>

<div id="menu" class="card">
<h2>Selecciona un nivel</h2>

<button onclick="startGame(1)">Nivel 1 - Reordenar</button>
<button onclick="startGame(2)">Nivel 2 - Continuar tras error</button>
<button onclick="startGame(3)">Nivel 3 - Reinicio por error</button>
<button onclick="startGame(4)">Nivel 4 - Simulación OSCE</button>
</div>

<div id="game" class="card hidden">

<div class="topbar">
<div class="badge">Nivel: <span id="nivel"></span></div>
<div class="badge">⏱ <span id="timer">02:00</span></div>
<div class="badge">Errores: <span id="errores">0</span></div>
</div>

<div id="instructions"></div>

<br>

<div id="steps"></div>

<div id="message"></div>

</div>

<div id="result" class="card hidden">
<div id="resultText"></div>
<br>
<button onclick="location.reload()">Volver al menú</button>
</div>

</div>

<script>

const checklist = [
"Se presenta ante la familia",
"Realiza lavado de manos",
"Coloca en posición semisentada al paciente",
"Realiza oximetría de pulso",
"Coloca oxígeno con máscara con reservorio",
"Monitoriza y determina signos vitales (fr resp, fr cardiaca, temp)",
"Realiza examen físico respiratorio. ( inspección, auscultación anterior, lateral y posterior, evalua disnea y el uso músculos accesorios, sibilancias)",
"Realiza examen físico cardiovascular ( auscultación cardiaca, palpación de pulsos periféricos )",
"Dice que evalúa estado de conciencia",
"Dice que evalúa habla",
"Inicia tratamiento con salbutamol: en aerosol, 4 y hasta 8-10 aplicaciones de acuerdo con la gravedad y peso, con aerocamara cada 20 minutos durante una hora (3 veces = serie)",
"Agrega Bromuro de ipratropio en aerosol 40-80 μg (2-4 pulsaciones) con aerocámara. cada 20 min durante 1 hora (3 veces = serie)",
"Coloca de vía periférica y solicita laboratorios (estado ácido base, ionograma, hemograma, urea, glucemia y creatinina)",
"Pasa hidrocortisona vía ev de 5 a 10mg/kg/dosis",
"Evalúa signos de CRIA: fatiga (disnea en reposo), inclinado hacia adelante, disminución de la frecuencia cardiaca (bradicardia), aparición de asincronía toracoabdominal, tendencia al sueño/confuso, tórax silencioso sin sibilancias. Dar aviso a terapista en caso de signos positivos",
"Comunica al familiar que se internará al paciente y/o deriva a centro de mayor complejidad"
];

let level=1;
let current=0;
let errors=0;
let score=0;
let mistakes=[];
let seconds=120;
let timer;

function shuffle(a){
return [...a].sort(()=>Math.random()-0.5);
}

function startGame(l){

level=l;
current=0;
errors=0;
score=0;
mistakes=[];

document.getElementById("menu").classList.add("hidden");
document.getElementById("game").classList.remove("hidden");

document.getElementById("nivel").textContent=l;
document.getElementById("errores").textContent="0";

startTimer();

if(l===1){
level1();
}else{
selectionMode();
}
}

function startTimer(){

seconds=120;

updateClock();

clearInterval(timer);

timer=setInterval(()=>{

seconds--;

updateClock();

if(seconds<=0){
finish("⏰ Tiempo agotado");
}

},1000);
}

function updateClock(){

let m=Math.floor(seconds/60);
let s=seconds%60;

document.getElementById("timer").textContent=
String(m).padStart(2,"0")+":"+
String(s).padStart(2,"0");
}

function level1(){

document.getElementById("instructions").innerHTML=
"<b>Ordena correctamente el checklist.</b>";

const box=document.getElementById("steps");

box.innerHTML="";

let items=shuffle(checklist);

items.forEach(t=>{

let d=document.createElement("div");

d.className="step";
d.draggable=true;
d.textContent=t;

box.appendChild(d);

});

enableDrag();

let btn=document.createElement("button");

btn.innerText="Verificar";

btn.onclick=verifyOrder;

box.appendChild(btn);
}

function enableDrag(){

let drag;

document.querySelectorAll(".step").forEach(el=>{

el.addEventListener("dragstart",()=>drag=el);

el.addEventListener("dragover",(e)=>e.preventDefault());

el.addEventListener("drop",(e)=>{

e.preventDefault();

if(drag!==el){

let parent=el.parentNode;

let nodes=[...parent.querySelectorAll(".step")];

if(nodes.indexOf(drag)<nodes.indexOf(el))
parent.insertBefore(drag,el.nextSibling);
else
parent.insertBefore(drag,el);

}

});

});

}

function verifyOrder(){

let order=[...document.querySelectorAll(".step")]
.map(x=>x.textContent);

let ok=true;

for(let i=0;i<checklist.length;i++){

if(order[i]!==checklist[i]){
ok=false;
break;
}

}

if(ok){
finishOSCELike();
}else{
document.getElementById("message").innerHTML=
"❌ El orden no es correcto.";
}
}

function selectionMode(){

document.getElementById("instructions").innerHTML=
"<b>Selecciona el siguiente paso correcto.</b>";

renderOptions();
}

function renderOptions(){

const box=document.getElementById("steps");

box.innerHTML="";

let options=shuffle(checklist).slice(0,6);

if(!options.includes(checklist[current])){
options[0]=checklist[current];
}

options=shuffle(options);

options.forEach(t=>{

let d=document.createElement("div");

d.className="step";
d.textContent=t;

d.onclick=()=>choose(t,d);

box.appendChild(d);

});
}

function choose(text,div){

if(text===checklist[current]){

div.classList.add("correct");

score++;

setTimeout(()=>{

current++;

if(current>=checklist.length){

if(level===4)
finishOSCELike();
else
finish("🏆 Checklist completado");

}else{
renderOptions();
}

},300);

}else{

div.classList.add("wrong");

errors++;

document.getElementById("errores").textContent=errors;

if(level===4){

score-=0.5;

mistakes.push({
esperado:checklist[current],
elegido:text
});

}

if(level===3){

current=0;

setTimeout(renderOptions,700);
}
}
}

function finish(text){

clearInterval(timer);

document.getElementById("game").classList.add("hidden");
document.getElementById("result").classList.remove("hidden");

document.getElementById("resultText").innerHTML=
"<h2>"+text+"</h2>";
}

function finishOSCELike(){

clearInterval(timer);

document.getElementById("game").classList.add("hidden");
document.getElementById("result").classList.remove("hidden");

let percent=Math.max(0,(score/checklist.length)*100);

let grade=(percent/10).toFixed(1);

let pass=grade>=6;

let html=`
<h2>📋 Resultado OSCE</h2>

<p><b>Nota:</b> ${grade}/10</p>

<p><b>Aciertos:</b> ${percent.toFixed(1)}%</p>

<p><b>Errores:</b> ${errors}</p>

<p><b>Resultado:</b>
${pass ? "✅ APROBADO" : "❌ NO APROBADO"}
</p>
`;

if(mistakes.length){

html+="<h3>Errores cometidos</h3><ul>";

mistakes.forEach(m=>{

html+=`
<li>
Elegido: ${m.elegido}<br>
Correcto: ${m.esperado}
</li><br>
`;

});

html+="</ul>";
}

document.getElementById("resultText").innerHTML=html;
}

</script>

</body>
</html>
